<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EliteCover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="background.png" id="bg-image" alt="background">

    <header>
        <div class="logo">EliteCover</div>
        <div class="auth-buttons" id="auth-section">
            <button class="btn" onclick="showForm('login')">log in</button>
            <span class="separator">/</span>
            <button class="btn" onclick="showForm('signup')">register</button>
        </div>
        <div id="user-display" style="display:none;">
            <span id="welcome-name"></span>
            <span class="logout-link" onclick="logout()">Logout</span>
        </div>
    </header>

    <main class="main-content">
        <div id="home-view" class="view active">
            <div class="black-frame">
                <img src="case.png" alt="Case" class="single-case-img">
            </div>
        </div>

        <div id="login-form" class="form-box">
            <h2>Login</h2>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-pass" placeholder="Password">
            <button class="submit-btn" onclick="login()">Είσοδος</button>
            <p class="switch-text">Δεν έχεις λογαριασμό; <a href="#" onclick="showForm('signup')">Register</a></p>
        </div>

        <div id="signup-form" class="form-box">
            <h2>Register</h2>
            <input type="text" id="reg-user" placeholder="Username">
            <input type="email" id="reg-email" placeholder="Email">
            <input type="password" id="reg-pass" placeholder="Password">
            <button class="submit-btn" onclick="register()">Εγγραφή</button>
            <p class="switch-text">Έχεις λογαριασμό; <a href="#" onclick="showForm('login')">Log in</a></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
