<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EliteCoverCase</title>

    <!-- Προσθήκη Favicon (Το εικονίδιο στο Tab) -->
    <link rel="icon" type="image/png" href="images/favicon.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="cart-container" onclick="showView('cart-view')">
            <img src="images/cart.png" alt="Cart" class="cart-icon">
            <span id="cart-count">0</span>
        </div>
        <div class="logo-astral-purple" onclick="showView('home-view')">EliteCoverCase</div>
        <div class="auth-buttons" id="auth-section">
            <button class="btn astral-btn-purple" onclick="showForm('login')">log in</button>
            <span class="separator">/</span>
            <button class="btn astral-btn-purple" onclick="showForm('signup')">register</button>
        </div>
        <div id="user-display" style="display:none;">
            <span id="welcome-name" class="astral-text-purple"></span>
            <span class="logout-link" onclick="logout()">Logout</span>
        </div>
    </header>

    <main class="main-content">
        <div id="home-view" class="view active">
            <div class="grid-container">
                <div class="product-card" onclick="showView('product-view')">
                    <img src="images/case.png" alt="Case">
                </div>
            </div>
        </div>

        <div id="product-view" class="view">
            <div class="product-page-layout">
                <div class="product-img-box">
                    <img src="images/case.png" alt="Case Photo">
                </div>
                <div class="product-info">
                    <h1 class="astral-text-purple">Tung Tung Tung Sahur Case</h1>
                    <div class="dropdown">
                        <button class="select-btn astral-btn-purple" id="selected-phone-btn" onclick="toggleDropdown()">select phone</button>
                        <div id="phone-dropdown" class="dropdown-content">
                            <p onclick="selectBrand('iPhone')">iPhone</p>
                            <p onclick="selectBrand('Samsung')">Samsung</p>
                            <p onclick="selectBrand('Xiaomi')">Xiaomi</p>
                            <p onclick="selectBrand('Honor')">Honor</p>
                        </div>
                    </div>
                    <div class="price-section">
                        <p>ΤΙΜΗ: <span class="green-price">10 ΕΥΡΩ</span></p>
                    </div>
                    <button class="add-to-cart-btn astral-btn-purple" onclick="addToCart()">ΠΡΟΣΘΗΚΗ ΣΤΟ ΚΑΛΑΘΙ</button>
                </div>
            </div>
        </div>

        <div id="cart-view" class="view">
            <div class="cart-page">
                <h2 class="astral-text-purple">Το Καλάθι μου</h2>
                <div id="cart-items-list"></div>
                <button class="astral-btn-purple" onclick="showView('home-view')">Πίσω στα Προϊόντα</button>
            </div>
        </div>

        <div id="login-form" class="form-box">
            <h2 class="astral-text-purple">Login</h2>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-pass" placeholder="Password">
            <button class="submit-btn astral-btn-purple" onclick="login()">Είσοδος</button>
        </div>

        <div id="signup-form" class="form-box">
            <h2 class="astral-text-purple">Register</h2>
            <input type="text" id="reg-user" placeholder="Username">
            <input type="email" id="reg-email" placeholder="Email">
            <input type="password" id="reg-pass" placeholder="Password">
            <button class="submit-btn astral-btn-purple" onclick="register()">Εγγραφή</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
