<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>EliteCover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="cart-container" onclick="showView('cart-view')">
            <img src="image/cart.png" alt="Cart" class="cart-icon">
        </div>

        <div class="logo" onclick="showView('home-view')">EliteCover</div>

        <div class="auth-buttons" id="auth-section">
            <button class="btn" onclick="showForm('login')">log in</button>
            <span class="separator">/</span>
            <button class="btn" onclick="showForm('signup')">register</button>
        </div>
    </header>

    <main class="main-content">
        <div id="home-view" class="view active">
            <button class="product-button" onclick="showView('product-view')">
                <img src="image/case.png" alt="Case">
            </button>
        </div>

        <div id="product-view" class="view">
            <div class="product-page-layout">
                <div class="left-side">
                    <div class="black-frame">
                        <img src="image/case.png" alt="Case Photo">
                    </div>
                </div>
                <div class="right-side">
                    <h1>Tung Tung Tung Sahur Case</h1>
                    
                    <button class="select-btn" onclick="toggleDropdown()">Select Phone</button>
                    <div id="phone-dropdown" class="dropdown-content">
                        <p onclick="selectBrand('iPhone')">iPhone</p>
                        <p onclick="selectBrand('Samsung')">Samsung</p>
                        <p onclick="selectBrand('Xiaomi')">Xiaomi</p>
                        <p onclick="selectBrand('Honor')">Honor</p>
                    </div>

                    <div class="price-tag">
                        ΤΙΜΗ: <span class="green-box">10 ΕΥΡΩ</span>
                    </div>
                    <button class="add-to-cart-btn" onclick="addToCart()">ΠΡΟΣΘΗΚΗ ΣΤΟ ΚΑΛΑΘΙ</button>
                </div>
            </div>
        </div>

        <div id="cart-view" class="view">
            <h2>Το Καλάθι μου</h2>
            <div id="cart-items">
                <p>Το καλάθι είναι άδειο.</p>
            </div>
            <button class="btn" onclick="showView('home-view')">Επιστροφή στα προϊόντα</button>
        </div>

        <div id="login-form" class="form-box">...</div>
        <div id="signup-form" class="form-box">...</div>
    </main>

    <script src="script.js"></script>
</body>
</html>
