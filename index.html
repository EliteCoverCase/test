<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EliteCover - Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">EliteCover</div>
        
        <div class="auth-buttons" id="auth-section">
            <button class="btn" onclick="showForm('login')">log in</button>
            <span class="separator">/</span>
            <button class="btn" onclick="showForm('signup')">sign up</button>
        </div>

        <div id="user-display">
            <span id="welcome-name"></span>
            <span class="logout-link" onclick="logout()">Logout</span>
        </div>
    </header>

    <main class="main-content">
        <!-- Το Product Card αριστερά -->
        <div id="home-view" class="view active">
            <div class="product-container">
                <div class="black-frame">
                    <img src="images/letters.png" alt="Logo Letters" class="img-letters">
                    <img src="images/case.png" alt="Phone Case" class="img-case">
                </div>
            </div>
        </div>

        <!-- Φόρμα Login -->
        <div id="login-form" class="form-box">
            <h2>Login</h2>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-pass" placeholder="Password">
            <button class="submit-btn" onclick="login()">Είσοδος</button>
            <p class="switch-text">Δεν έχεις λογαριασμό; <a href="#" onclick="showForm('signup')">Sign up</a></p>
        </div>

        <!-- Φόρμα Sign Up -->
        <div id="signup-form" class="form-box">
            <h2>Sign Up</h2>
            <input type="text" id="reg-user" placeholder="Username">
            <input type="email" id="reg-email" placeholder="Email">
            <input type="tel" id="reg-phone" placeholder="Phone Number">
            <input type="password" id="reg-pass" placeholder="Password">
            <button class="submit-btn" onclick="register()">Εγγραφή</button>
            <p class="switch-text">Έχεις λογαριασμό; <a href="#" onclick="showForm('login')">Log in</a></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
